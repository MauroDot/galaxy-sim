<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaxy N-Body Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="sim-canvas"></canvas>

  <div id="transition-overlay"></div>
  <div id="tooltip" class="hidden"></div>
  <button id="backToGalaxyBtn" class="hidden">← Back to Galaxy</button>

  <div id="ui-panel">
    <h1>Galaxy Sim</h1>

    <div id="modeIndicator" class="mode-galaxy">Galaxy View</div>

    <div class="row">
      <button id="playPauseBtn">⏸ Pause</button>
      <button id="resetBtn">⟲ Reset</button>
    </div>

    <div class="row">
      <label for="speedSlider">Speed <span id="speedLabel">1.00x</span></label>
      <input id="speedSlider" type="range" min="0" max="20" step="0.25" value="1" />
    </div>

    <div class="row">
      <label for="seedInput">Seed</label>
      <input id="seedInput" type="text" placeholder="seed" />
    </div>

    <div class="row">
      <label for="starCountInput">Stars</label>
      <input id="starCountInput" type="number" min="10" max="3000" value="500" />
    </div>

    <div class="row">
      <button id="regenBtn">🎲 New Galaxy</button>
    </div>

    <div id="stats">
      <div>FPS: <span id="fpsStat">-</span></div>
      <div>Physics Hz: <span id="physStat">-</span></div>
      <div>Stars: <span id="starStat">-</span></div>
      <div>Black Holes: <span id="blackHoleStat">-</span></div>
      <div>Supernovae: <span id="supernovaStat">0</span></div>
      <div>Absorbed: <span id="absorptionStat">0</span></div>
      <div id="coreGrowthRow" class="hidden">Core growth: <span id="coreGrowthStat">-</span></div>
    </div>

    <div id="legend">
      <span style="color:#4d6dff">O</span>
      <span style="color:#a6c0ff">B</span>
      <span style="color:#ffffff">A</span>
      <span style="color:#fff5d1">F</span>
      <span style="color:#ffe066">G</span>
      <span style="color:#ffa347">K</span>
      <span style="color:#ff4d4d">M</span>
      <span style="color:#b078ff" title="Black hole">◎</span>
      <span style="color:#fff7c2" title="Quasar">✺</span>
      <span style="color:#cfe8ff" title="Neutron star">✦</span>
    </div>

    <p class="hint">Scroll to zoom · Drag to pan · Space to play/pause · Click a body for info · D for debug overlay</p>
  </div>

  <div id="info-panel" class="hidden">
    <h2 id="infoTitle">-</h2>
    <div class="info-row"><span id="infoLabel1">Type</span><span id="infoValue1">-</span></div>
    <div class="info-row"><span id="infoLabel2">Mass</span><span id="infoValue2">-</span></div>
    <div class="info-row"><span id="infoLabel3">Age</span><span id="infoValue3">-</span></div>
    <div class="info-row"><span id="infoLabel4">Lifetime</span><span id="infoValue4">-</span></div>
    <div class="info-row hidden" id="infoRow5"><span id="infoLabel5">-</span><span id="infoValue5">-</span></div>
    <div class="info-row hidden" id="infoRow6"><span id="infoLabel6">-</span><span id="infoValue6">-</span></div>
    <div id="infoFlash" class="hidden"></div>
    <button id="infoAction" class="hidden"></button>
  </div>

  <script src="src/star-types.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
